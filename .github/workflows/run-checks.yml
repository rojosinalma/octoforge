name: run-checks
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message }} · ${{ github.actor }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job id is a required status check in the branch rules: keep it `check`.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Index checks, typecheck, lint, tests, build, then the image and a /health smoke test.
      - run: bin/verify
